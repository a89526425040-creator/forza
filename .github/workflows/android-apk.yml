name: Open Horizon Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare Godot Android export environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a /root/.config/godot/. "$HOME/.config/godot/"
          echo "=== Install Godot 4.4 Android SDK requirements ==="
          set +o pipefail
          yes | /usr/lib/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/lib/android-sdk --licenses
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$license_status" -ne 0 ]; then
            echo "SDK license acceptance failed with exit code $license_status"
            exit "$license_status"
          fi
          /usr/lib/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/lib/android-sdk "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;23.2.8568313" "cmake;3.10.2"
          cat >> "$HOME/.config/godot/editor_settings-4.4.tres" <<'EOF'
          export/android/ndk_path = "/usr/lib/android-sdk/ndk/23.2.8568313"
          export/android/cmake_path = "/usr/lib/android-sdk/cmake/3.10.2"
          EOF
          cp -a /root/.local/share/godot/export_templates/4.4.1.stable "$HOME/.local/share/godot/export_templates/"
          test -f /root/debug.keystore
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          godot --version
          java -version
          echo "=== Godot config files ==="
          find /root/.config/godot "$HOME/.config/godot" -maxdepth 3 -type f -print
          echo "=== Android settings ==="
          grep -RniE "android|sdk|keystore|jdk" /root/.config/godot "$HOME/.config/godot" || true
          echo "=== Android SDK ==="
          ls -la /usr/lib/android-sdk
          ls -la /usr/lib/android-sdk/build-tools || true
          ls -la /usr/lib/android-sdk/platforms || true
          echo "=== Build tools files ==="
          find /usr/lib/android-sdk/build-tools -maxdepth 2 -type f -printf "%p\n" | sort
          echo "=== Platform SDK files ==="
          find /usr/lib/android-sdk/platforms/android-33 -maxdepth 2 -type f -printf "%p\n" | sort | head -100
          echo "=== SDK package metadata ==="
          find /usr/lib/android-sdk -maxdepth 3 -name package.xml -o -name source.properties | sort
          echo "=== Keystore validation ==="
          keytool -list -keystore /root/debug.keystore -storepass android -alias androiddebugkey
          echo "=== Export templates ==="
          ls -la "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          echo "=== Keystore ==="
          ls -l /root/debug.keystore

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/OpenHorizon.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: Open-Horizon-Android
          path: build/OpenHorizon.apk
          if-no-files-found: error
